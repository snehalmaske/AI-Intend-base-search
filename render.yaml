services:
  - type: web
    name: maison-vireo
    runtime: node
    plan: free
    # rm -rf node_modules first: Render caches node_modules between builds,
    # and a build that failed partway through optional-dependency install
    # (see npm/cli#4828) can leave a broken cache that a plain `npm install`
    # won't detect or repair on the next build. Forcing a clean install
    # trades a few seconds of build time for not silently reusing that.
    buildCommand: rm -rf node_modules client/node_modules server/node_modules && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: NODE_VERSION
        value: 20.18.0
